[project]
name = "lobsim"
version = "0.1.0"
description = "A limit order book matching engine and market-replay backtester"
readme = "README.md"
authors = [{ name = "Yanwat" }]
requires-python = ">=3.11"
dependencies = ["sortedcontainers>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
