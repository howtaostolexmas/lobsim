[project]
name = "lobsim"
version = "0.1.0"
description = "A limit order book matching engine and market-replay backtester"
readme = "README.md"
authors = [{ name = "Yanwat" }]
requires-python = ">=3.11"
dependencies = ["sortedcontainers>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/lobsim"]
cmake.build-type = "Release"

[tool.uv]
# Rebuild the C++ extension automatically when any of these change, so
# `uv run pytest` never tests a stale build.
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/cpp/**" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
